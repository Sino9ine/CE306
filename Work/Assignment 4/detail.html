<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>รายละเอียดรถ</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="index.html">
            🚗 AUTO WORLD
        </a>

        <a class="btn btn-outline-light"
           href="cars.html">
            ← กลับ
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row align-items-center">

        <div class="col-md-6">

            <img id="carImage"
                 class="detail-img">

        </div>


        <div class="col-md-6">

            <h1 id="name"></h1>

            <h3 id="price"
                class="text-danger">
            </h3>

            <p>
                <b>ประเภท:</b>
                <span id="type"></span>
            </p>

            <p>
                <b>เครื่องยนต์:</b>
                <span id="engine"></span>
            </p>

            <p id="description"></p>

        </div>

    </div>

</div>


<footer>
    AUTO WORLD | เว็บไซต์แนะนำรถยนต์
</footer>


<script>

const cars = {

    yaris: {
        name: "Toyota Yaris",
        price: "เริ่มต้น 584,000 บาท",
        type: "Hatchback",
        engine: "1.2 ลิตร",
        image: "images/yaris.jpg",
        description:
        "รถยนต์ขนาดกะทัดรัด เหมาะสำหรับการใช้งานในเมืองและการเดินทางในชีวิตประจำวัน"
    },

    civic: {
        name: "Honda Civic e:HEV",
        price: "เริ่มต้น 949,000 บาท",
        type: "Sedan / Hybrid",
        engine: "e:HEV",
        image: "images/civic.jpg",
        description:
        "รถยนต์ซีดานสไตล์สปอร์ต พร้อมระบบขับเคลื่อนไฮบริดและเทคโนโลยีช่วยเหลือด้านความปลอดภัย"
    },

    mazda3: {
        name: "Mazda 3",
        price: "ติดต่อโชว์รูม",
        type: "Sedan / Fastback",
        engine: "เบนซิน",
        image: "images/mazda3.jpg",
        description:
        "รถยนต์ดีไซน์สปอร์ตที่เน้นความสวยงามและประสบการณ์การขับขี่"
    }

};


const params =
    new URLSearchParams(location.search);

const id =
    params.get("car");

const car =
    cars[id] || cars.yaris;


document.getElementById("name")
    .textContent = car.name;

document.getElementById("price")
    .textContent = car.price;

document.getElementById("type")
    .textContent = car.type;

document.getElementById("engine")
    .textContent = car.engine;

document.getElementById("description")
    .textContent = car.description;

document.getElementById("carImage")
    .src = car.image;

document.title =
    car.name + " | AUTO WORLD";

</script>

</body>
</html>
