<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Auto World</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            🚗 AUTO WORLD
        </a>

        <a class="btn btn-outline-light"
           href="cars.html">
            รถยนต์
        </a>

    </div>
</nav>


<header class="hero text-center">

    <h1>AUTO WORLD</h1>

    <p>
        ศูนย์รวมรถยนต์สำหรับคนรักรถ
    </p>

    <a href="cars.html"
       class="btn btn-danger">
        ดูรถยนต์ทั้งหมด
    </a>

</header>


<div class="container py-5">

    <h2 class="text-center mb-4">
        🚘 รถยนต์แนะนำ
    </h2>

    <div class="row g-4">


        <!-- Yaris -->

        <div class="col-md-4">

            <a href="detail.html?car=yaris"
               class="car-link">

                <div class="card">

                    <img src="images/yaris.jpg"
                         class="car-img">

                    <div class="card-body">

                        <h3>Toyota Yaris</h3>

                        <p>
                            ราคาเริ่มต้น 584,000 บาท
                        </p>

                        <span class="btn btn-danger">
                            ดูรายละเอียด
                        </span>

                    </div>

                </div>

            </a>

        </div>


        <!-- Civic -->

        <div class="col-md-4">

            <a href="detail.html?car=civic"
               class="car-link">

                <div class="card">

                    <img src="images/civic.jpeg"
                         class="car-img">

                    <div class="card-body">

                        <h3>Honda Civic e:HEV</h3>

                        <p>
                            ราคาเริ่มต้น 949,000 บาท
                        </p>

                        <span class="btn btn-danger">
                            ดูรายละเอียด
                        </span>

                    </div>

                </div>

            </a>

        </div>


        <!-- Mazda -->

        <div class="col-md-4">

            <a href="detail.html?car=mazda3"
               class="car-link">

                <div class="card">

                    <img src="images/mazda3.jpg"
                         class="car-img">

                    <div class="card-body">

                        <h3>Mazda 3</h3>

                        <p>
                            รถยนต์สไตล์สปอร์ต
                        </p>

                        <span class="btn btn-danger">
                            ดูรายละเอียด
                        </span>

                    </div>

                </div>

            </a>

        </div>

    </div>

</div>


<footer>
    AUTO WORLD | เว็บไซต์แนะนำรถยนต์
</footer>

</body>
</html>
